name: Verify landscape library
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vgpu install-software-renderer
      - run: npm run check:shaders
        env:
          VGPU_ADAPTER: software
      - run: npm run test:gpu
        env:
          VGPU_ADAPTER: software
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance
          path: |
            test-results/gpu-primitives
